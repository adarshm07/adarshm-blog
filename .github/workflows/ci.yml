name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: npx tsc --noEmit

      # The build is the real gate: MDX and RSC errors only surface during
      # static generation, not during typecheck.
      - run: yarn build

      # Load every sitemap page in Chromium at phone width and step each
      # visualizer once: catches runtime errors, hydration mismatches and
      # sideways overflow that a successful build cannot.
      - run: npx playwright install --with-deps chromium

      - name: Smoke-test every page
        run: |
          yarn start -p 3000 &
          yarn smoke
